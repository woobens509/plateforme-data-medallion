version: 2

models:
  - name: stg_olist_orders
    description: "Commandes Olist nettoyées, avec les dates correctement typées"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: stg_olist_customers
    description: "Clients Olist nettoyés"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_olist_order_items
    description: "Articles de commande Olist, avec prix et frais de port"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: stg_superstore
    description: "Ventes Superstore nettoyées"
    columns:
      - name: row_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: sales
        tests:
          - not_null