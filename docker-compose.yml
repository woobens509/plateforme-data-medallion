services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio_projet3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  postgres_projet3:
    image: postgres:16
    container_name: postgres_projet3
    environment:
      POSTGRES_USER: plateforme_user
      POSTGRES_PASSWORD: plateforme_password
      POSTGRES_DB: plateforme_db
    ports:
      - "5435:5432"
    volumes:
      - postgres3_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_projet3
    ports:
      - "3001:3000"
    volumes:
      - metabase_data:/metabase-data

volumes:
  minio_data:
  postgres3_data:
  metabase_data: